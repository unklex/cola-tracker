name: colatracker

services:
  colatracker:
    build: .
    container_name: colatracker
    restart: unless-stopped
    # Токен берётся из .env (COLA_AUTH_TOKEN=...) и нужен только при создании новой базы.
    # Если импортируете data.json, токен переносится из него.
    environment:
      COLA_AUTH_TOKEN: ${COLA_AUTH_TOKEN:-}
    volumes:
      - cola-data:/data   # база cola.db и фото переживают пересборку контейнера
    # Только localhost: наружу API отдаёт nginx по HTTPS (см. nginx-cola.conf).
    # Публикация "8000:8000" открыла бы порт в интернет в обход файрвола (Docker не слушается ufw).
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  cola-data:
