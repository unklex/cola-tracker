# nginx перед контейнером Cola Tracker (TLS завершается на nginx, API слушает 127.0.0.1:8000).
#
# Установка на сервере:
#   1) cp nginx-cola.conf /etc/nginx/conf.d/cola.st77.ru.conf       (замените имя хоста на своё)
#   2) nginx -t && systemctl reload nginx
#   3) certbot --nginx -d cola.st77.ru                               (добавит 443 и редирект с 80)
#
# DNS: запись A  cola  ->  IP сервера.

server {
    listen 80;
    listen [::]:80;
    server_name cola.st77.ru;

    # Фото ограничены в приложении 10 МБ; запас на multipart
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }
}
